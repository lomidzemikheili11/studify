<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studify — Mesajlarım</title>
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="stylesheet" href="css/style.css">
<script>(function(){try{var t=localStorage.getItem("studifyTheme");if(t!=="light")document.documentElement.setAttribute("data-theme","dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
<style>
  .msg-shell { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 78px); border-top: 1px solid var(--gray-200); }
  .msg-sidebar { border-right: 1px solid var(--gray-200); overflow-y: auto; background: var(--gray-100); }
  .msg-sidebar-head { padding: 16px 18px; font-weight: 700; color: var(--navy); border-bottom: 1px solid var(--gray-200); background: var(--surface); }
  .conv-item { display: flex; align-items: center; gap: 10px; padding: 13px 16px; cursor: pointer; border-bottom: 1px solid var(--gray-200); }
  .conv-item:hover, .conv-item.active { background: var(--blue-pale); }
  .conv-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--white); object-fit: cover; flex-shrink: 0; }
  .conv-name { font-weight: 700; font-size: 13.5px; color: var(--navy); }
  .conv-preview { font-size: 12px; color: var(--gray-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  .conv-badge { background: var(--blue); color: #fff; font-size: 10.5px; font-weight: 700; border-radius: 20px; padding: 1px 7px; margin-left: auto; }
  .msg-main { display: flex; flex-direction: column; height: 100%; }
  .msg-main-head { padding: 14px 20px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; gap: 10px; }
  .msg-thread { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 65%; padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; }
  .bubble.mine { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.theirs { align-self: flex-start; background: var(--gray-100); color: var(--navy); border-bottom-left-radius: 4px; }
  .bubble .time { font-size: 10px; opacity: .7; margin-top: 4px; }
  .translation-toggle { font-size: 10px; opacity: .75; margin-top: 5px; cursor: pointer; text-decoration: underline; }
  .msg-input-row { padding: 14px 20px; border-top: 1px solid var(--gray-200); display: flex; gap: 10px; }
  .msg-input-row textarea { flex: 1; border: 1.5px solid var(--gray-200); background: var(--surface); color: var(--gray-900); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; font-family: inherit; resize: none; }
  .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--gray-500); font-size: 13.5px; text-align: center; padding: 40px; }
  @media (max-width: 800px) {
    .msg-shell { grid-template-columns: 1fr; height: calc(100vh - 78px); }
    .msg-sidebar { display: block; }
    .msg-sidebar.hide-mobile { display: none; }
    .msg-main.hide-mobile { display: none; }
    .msg-back-btn { display: inline-flex !important; }
  }
  .msg-back-btn { display: none; background: none; border: none; padding: 4px; }
</style>
</head>
<body>

  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo"><img src="images/logo.png" alt="Studify"><b>Studify</b></a>
      <nav class="main-nav">
        <a href="index.html" data-i18n="nav_home">Ana Sayfa</a>
        <a href="teachers.html" data-i18n="nav_teachers">Öğretmenler</a>
      </nav>
      <div class="header-right">
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Tema değiştir" title="Tema değiştir"></button>
        <div class="lang-switcher" data-id="1"></div>
        <div id="authArea"></div>
        <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
    <nav class="mobile-nav"><div id="authAreaMobile"></div></nav>
  </header>

  <div class="msg-shell">
    <aside class="msg-sidebar" id="msgSidebar">
      <div class="msg-sidebar-head" id="sidebarTitle">Mesajlarım</div>
      <div id="conversationList"><p style="padding:20px; color:var(--gray-500); font-size:13px;">Yükleniyor...</p></div>
    </aside>
    <main class="msg-main" id="msgMain">
      <div class="empty-state" id="emptyState">Görüntülemek için bir konuşma seçin.</div>
      <div id="activeThread" style="display:none; flex-direction:column; height:100%;">
        <div class="msg-main-head">
          <button class="msg-back-btn" id="backBtn">←</button>
          <img id="threadAvatar" class="conv-avatar" src="" alt="">
          <div>
            <div style="font-weight:700; color:var(--navy); font-size:14px;" id="threadName"></div>
            <div style="font-size:11.5px; color:var(--gray-500);" id="threadRole"></div>
          </div>
        </div>
        <div class="msg-thread" id="threadMessages"></div>
        <div class="msg-input-row">
          <textarea id="msgInput" rows="1" placeholder="Bir mesaj yazın..."></textarea>
          <button class="btn btn-primary" id="sendBtn">Gönder</button>
        </div>
      </div>
    </main>
  </div>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script src="js/messages.js"></script>
</body>
</html>
