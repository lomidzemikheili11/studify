<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İletişim — Studify</title>
<meta name="description" content="Sorularınız için bizimle iletişime geçin.">
<meta property="og:title" content="İletişim — Studify">
<meta property="og:description" content="Sorularınız için bizimle iletişime geçin.">
<meta property="og:type" content="website">
<meta property="og:image" content="/images/logo.png">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="stylesheet" href="css/style.css">
<script>(function(){try{var t=localStorage.getItem("studifyTheme");if(t!=="light")document.documentElement.setAttribute("data-theme","dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo"><img src="images/logo.png" alt="Studify"><b>Studify</b></a>
      <nav class="main-nav">
        <a href="index.html" data-i18n="nav_home">Home</a>
        <a href="teachers.html" data-i18n="nav_teachers">Teachers</a>
        <a href="how-it-works.html" data-i18n="nav_how">How It Works</a>
        <a href="blog.html">Blog</a>
        <a href="about.html" data-i18n="nav_about">About Us</a>
        <a href="contact.html" class="active" data-i18n="nav_contact">Contact</a>
      </nav>
      <div class="header-right">
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Tema değiştir" title="Tema değiştir"></button>
        <div class="lang-switcher" data-id="1"></div>
        <div id="authArea">
          <a href="login.html" class="btn btn-outline" data-i18n="login">Log In</a>
          <a href="signup.html" class="btn btn-primary" data-i18n="signup">Sign Up</a>
        </div>
        <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
    <nav class="mobile-nav"><a href="index.html" data-i18n="nav_home">Home</a><a href="teachers.html" data-i18n="nav_teachers">Teachers</a></nav>
  </header>

  <section class="page-hero">
    <div class="container"><h1 data-i18n="nav_contact">Contact</h1><p>Sizden haber almak isteriz.</p></div>
  </section>

  <section class="section">
    <div class="container" style="max-width:600px;">
      <form id="contactForm">
        <div class="form-row">
          <div class="form-group"><label>Ad Soyad</label><input type="text" id="cName" required></div>
          <div class="form-group"><label>Telefon</label><input type="tel" id="cPhone"></div>
        </div>
        <div class="form-group"><label data-i18n="auth_email">Email</label><input type="email" id="cEmail" required></div>
        <div class="form-group">
          <label>Konu</label>
          <select id="cSubject"><option>Genel Soru</option><option>Öğretmen olmak istiyorum</option><option>Teknik Destek</option></select>
        </div>
        <div class="form-group"><label>Mesaj</label><textarea id="cMessage" rows="5" required></textarea></div>
        <p class="error-box" id="contactError"></p>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Mesaj Gönder</button>
        <p class="success-box" id="contactSuccess" style="text-align:center; margin-top:14px;">✓ Mesajınız gönderildi.</p>
      </form>
    </div>
  </section>

  <footer class="site-footer"><div class="container"><div class="footer-bottom" style="border-top:none; padding-top:0;"><span>🇹🇷</span> © 2026 Studify.</div></div></footer>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
</body>
</html>
