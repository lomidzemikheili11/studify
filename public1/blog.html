<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Studify</title>
<meta name="description" content="Öğrenme, öğretmenlik ve eğitim dünyasından yazılar.">
<meta property="og:title" content="Blog — Studify">
<meta property="og:description" content="Öğrenme, öğretmenlik ve eğitim dünyasından yazılar.">
<meta property="og:type" content="website">
<meta property="og:image" content="/images/logo.png">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="stylesheet" href="css/style.css">
<script>(function(){try{var t=localStorage.getItem("studifyTheme");if(t!=="light")document.documentElement.setAttribute("data-theme","dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
<style>
  .blog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .blog-card { background: var(--surface); border: 1px solid var(--gray-200); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); transition: box-shadow .2s, transform .2s; display: block; }
  .blog-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .blog-cover { height: 140px; background: var(--blue-pale); display: flex; align-items: center; justify-content: center; font-size: 46px; }
  .blog-body { padding: 16px 18px 18px; }
  .blog-title { font-size: 15.5px; font-weight: 700; color: var(--navy); margin-bottom: 6px; line-height: 1.4; }
  .blog-summary { font-size: 13px; color: var(--gray-500); line-height: 1.6; margin-bottom: 10px; }
  .blog-date { font-size: 11.5px; color: var(--gray-500); }
  @media (max-width: 900px) { .blog-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo"><img src="images/logo.png" alt="Studify"><b>Studify</b></a>
      <nav class="main-nav">
        <a href="index.html" data-i18n="nav_home">Ana Sayfa</a>
        <a href="teachers.html" data-i18n="nav_teachers">Öğretmenler</a>
        <a href="how-it-works.html" data-i18n="nav_how">Nasıl Çalışır?</a>
        <a href="blog.html" class="active">Blog</a>
        <a href="about.html" data-i18n="nav_about">Hakkımızda</a>
        <a href="contact.html" data-i18n="nav_contact">İletişim</a>
      </nav>
      <div class="header-right">
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Tema değiştir" title="Tema değiştir"></button>
        <div class="lang-switcher" data-id="1"></div>
        <div id="authArea"></div>
        <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
    <nav class="mobile-nav">
      <a href="index.html" data-i18n="nav_home">Ana Sayfa</a>
      <a href="teachers.html" data-i18n="nav_teachers">Öğretmenler</a>
      <a href="blog.html">Blog</a>
      <a href="about.html" data-i18n="nav_about">Hakkımızda</a>
      <div id="authAreaMobile"><a href="login.html" class="btn btn-outline btn-block" data-i18n="login">Giriş</a></div>
    </nav>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1>Blog</h1>
      <p>Öğrenme, öğretmenlik ve eğitim dünyasından yazılar.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="blog-grid" id="blogGrid"><p style="color:var(--gray-500);">Yükleniyor...</p></div>
    </div>
  </section>

  <footer class="site-footer"><div class="container"><div class="footer-bottom" style="border-top:none; padding-top:0;"><span>🇹🇷</span> © 2026 Studify.</div></div></footer>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
  async function loadBlog() {
    var grid = document.getElementById("blogGrid");
    try {
      var data = await apiFetch("/articles");
      if (data.articles.length === 0) { grid.innerHTML = '<p style="color:var(--gray-500);">Henüz makale yayınlanmadı.</p>'; return; }
      grid.innerHTML = data.articles.map(function (a) {
        return '<a href="blog-post.html?slug=' + encodeURIComponent(a.slug) + '" class="blog-card">' +
          '<div class="blog-cover">' + a.coverEmoji + '</div>' +
          '<div class="blog-body">' +
            '<div class="blog-title">' + a.title.replace(/</g, "&lt;") + '</div>' +
            '<div class="blog-summary">' + (a.summary || "").replace(/</g, "&lt;") + '</div>' +
            '<div class="blog-date">' + new Date(a.publishedAt).toLocaleDateString("tr-TR", { day: "2-digit", month: "long", year: "numeric" }) + '</div>' +
          '</div>' +
        '</a>';
      }).join("");
    } catch (err) { grid.innerHTML = '<p style="color:var(--red);">' + err.message + '</p>'; }
  }
  document.addEventListener("DOMContentLoaded", loadBlog);
</script>
</body>
</html>
