<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studify — Blog</title>
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="stylesheet" href="css/style.css">
<script>(function(){try{var t=localStorage.getItem("studifyTheme");if(t!=="light")document.documentElement.setAttribute("data-theme","dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
</head>
<body>

  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo"><img src="images/logo.png" alt="Studify"><b>Studify</b></a>
      <nav class="main-nav">
        <a href="index.html" data-i18n="nav_home">Ana Sayfa</a>
        <a href="teachers.html" data-i18n="nav_teachers">Öğretmenler</a>
        <a href="how-it-works.html" data-i18n="nav_how">Nasıl Çalışır?</a>
        <a href="blog.html" class="active">Blog</a>
        <a href="about.html" data-i18n="nav_about">Hakkımızda</a>
        <a href="contact.html" data-i18n="nav_contact">İletişim</a>
      </nav>
      <div class="header-right">
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Tema değiştir" title="Tema değiştir"></button>
        <div class="lang-switcher" data-id="1"></div>
        <div id="authArea"></div>
        <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
    <nav class="mobile-nav">
      <a href="index.html" data-i18n="nav_home">Ana Sayfa</a>
      <a href="blog.html">Blog</a>
      <div id="authAreaMobile"><a href="login.html" class="btn btn-outline btn-block" data-i18n="login">Giriş</a></div>
    </nav>
  </header>

  <section class="section">
    <div class="container" style="max-width:760px;" id="postContainer">
      <p style="color:var(--gray-500);">Yükleniyor...</p>
    </div>
  </section>

  <footer class="site-footer"><div class="container"><div class="footer-bottom" style="border-top:none; padding-top:0;"><span>🇹🇷</span> © 2026 Studify.</div></div></footer>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
  async function loadPost() {
    var container = document.getElementById("postContainer");
    var slug = new URLSearchParams(window.location.search).get("slug");
    if (!slug) { container.innerHTML = '<p>Makale bulunamadı.</p>'; return; }
    try {
      var data = await apiFetch("/articles/" + encodeURIComponent(slug));
      var a = data.article;
      document.title = a.title + " — Studify";
      container.innerHTML =
        '<a href="blog.html" style="font-size:13px; color:var(--blue); font-weight:700;">← Blog\'a dön</a>' +
        '<div style="font-size:52px; margin:20px 0 10px;">' + a.coverEmoji + '</div>' +
        '<h1 style="color:var(--navy); font-size:28px; margin:0 0 10px;">' + a.title.replace(/</g, "&lt;") + '</h1>' +
        '<p style="font-size:13px; color:var(--gray-500); margin-bottom:24px;">' + new Date(a.publishedAt).toLocaleDateString("tr-TR", { day: "2-digit", month: "long", year: "numeric" }) + '</p>' +
        '<div style="font-size:15px; color:var(--gray-700); line-height:1.9; white-space:pre-wrap;">' + a.content.replace(/</g, "&lt;") + '</div>';
    } catch (err) {
      container.innerHTML = '<p style="color:var(--red);">Makale bulunamadı.</p>';
    }
  }
  document.addEventListener("DOMContentLoaded", loadPost);
</script>
</body>
</html>
